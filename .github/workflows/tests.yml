name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: "Also run the live Studionet end-to-end test"
        type: boolean
        default: false

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Direct-mode suite (includes the adversarial tests)
        run: NO_SERVE=1 bash scripts/run_all.sh unit
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/

  studionet:
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Studionet end-to-end
        run: NO_SERVE=1 bash scripts/run_all.sh e2e
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studionet-report
          path: reports/
