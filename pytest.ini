[pytest]
testpaths = tests
addopts = -ra
markers =
    adversarial: hostile evidence pages, hostile callers, hostile numbers (run alone: pytest tests -m adversarial)
    e2e: end-to-end test against a live GenLayer network (tests_e2e/, run with gltest --network studionet)
    timeout(seconds): per-test time limit (enforced when pytest-timeout is installed)
timeout = 900
timeout_method = thread
